<!DOCTYPE html>
<html>

<head>

    <title>Customer Self Checkout</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="https://unpkg.com/@zxing/library@latest"></script>


    <style>
        body {
            font-family: Arial;
            padding: 20px;
        }

        .box {
            border: 1px solid #ccc;
            padding: 15px;
            margin: 10px;
            border-radius: 8px;
        }

        input,
        button {
            padding: 8px;
            margin: 5px;
        }

        button {
            cursor: pointer;
        }

        video {
            width: 350px;
            border: 2px solid black;
        }
    </style>


</head>


<body>


    <h1>Customer Self Checkout</h1>



    <div class="box">

        <h3>Register</h3>


        <input id="regName" placeholder="Full Name">

        <br>

        <input id="regEmail" placeholder="Email">

        <br>

        <input id="regPassword" type="password" placeholder="Password">


        <br>

        <button type="button" onclick="register()">
            Register
        </button>


    </div>





    <div class="box">


        <h3>Login</h3>


        <input id="loginEmail" placeholder="Email">


        <br>


        <input id="loginPassword" type="password" placeholder="Password">


        <br>


        <button type="button" onclick="login()">
            Login
        </button>


    </div>





    <div class="box">


        <h3>Search Business</h3>


        <input id="businessSearch" placeholder="Store name">


        <button type="button" onclick="searchBusiness()">
            Search
        </button>


        <div id="businessList"></div>


    </div>






    <div class="box">


        <h3>Barcode Scanner</h3>


        <video id="video"></video>


        <br>


        <button type="button" onclick="startScanner()">
            Start Camera
        </button>


        <div id="scanResult"></div>


    </div>







    <div class="box">


        <h3>Products</h3>


        <div id="products"></div>


    </div>







    <div class="box">


        <h3>Cart</h3>


        <button type="button" onclick="loadCart()">
            View Cart
        </button>


        <div id="cartView"></div>


    </div>







    <script>


        const SUPABASE_URL =
            "https://bqtibupokfrojxlnhhaf.supabase.co";


        const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJxdGlidXBva2Zyb2p4bG5oaGFmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3NjE3OTIsImV4cCI6MjEwMjMzNzc5Mn0.NHNA2I7Ug3RaAi0imcJ-9hMk8htSjR1W76GmBl-WhXU";



        const db =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );



        let user = null;

        let selectedBusiness = null;

        let currentCart = null;

        let codeReader = null;





        // REGISTER


        async function register() {


            const { error } = await db.auth.signUp({

                email:
                    document.getElementById("regEmail").value,

                password:
                    document.getElementById("regPassword").value,


                options: {

                    data: {

                        full_name:
                            document.getElementById("regName").value

                    }

                }

            });



            if (error) {

                alert(error.message);

                return;

            }


            alert("Registration successful");


        }







        // LOGIN


        async function login() {


            const email =
                document.getElementById("loginEmail").value;


            const password =
                document.getElementById("loginPassword").value;



            const { data, error } = await db.auth.signInWithPassword({

                email,

                password

            });



            if (error) {

                alert(error.message);

                return;

            }



            user = data.user;


            alert(
                "Login successful"
            );



        }








        // SEARCH BUSINESS


        async function searchBusiness() {


            const text =
                document.getElementById("businessSearch").value;



            const { data, error } = await db

                .from("business_approved")

                .select("*")

                .ilike(
                    "name",
                    "%" + text + "%"
                );



            if (error) {

                alert(error.message);

                return;

            }



            let html = "";



            data.forEach(b => {


                html += `

<div class="box">

<h3>${b.name}</h3>


<button onclick='selectBusiness(${JSON.stringify(b)})'>

Open Store

</button>


</div>

`;



            });



            document.getElementById(
                "businessList"
            ).innerHTML = html;



        }








        // SELECT BUSINESS


        function selectBusiness(b) {


            selectedBusiness = b;


            alert(
                "Selected " + b.name
            );


            loadProducts();


        }









        // LOAD PRODUCTS


        async function loadProducts() {


            const { data, error } = await db

                .from("products")

                .select("*")

                .eq(
                    "business_id",
                    selectedBusiness.id
                );



            if (error) {

                alert(error.message);

                return;

            }



            let html = "";



            data.forEach(p => {


                html += `

<div class="box">


<h3>${p.name}</h3>


Barcode:

${p.id}


<br>


Price:

₹${p.price}


<br>


Stock:

${p.stock}


<br>


<button onclick="addToCart(${p.id})">

Add Cart

</button>


</div>


`;



            });



            document.getElementById(
                "products"
            ).innerHTML = html;


        }









        // START CAMERA


        function startScanner() {


            if (!selectedBusiness) {

                alert("Select business first");

                return;

            }



            codeReader =
                new ZXing.BrowserMultiFormatReader();



            codeReader.decodeFromVideoDevice(

                null,

                "video",

                (result, error) => {


                    if (result) {


                        let barcode = result.text;



                        document.getElementById(
                            "scanResult"
                        ).innerHTML =

                            "Scanned : " + barcode;



                        codeReader.reset();



                        findProduct(barcode);



                    }


                }


            );


        }









        // FIND PRODUCT FROM BARCODE


        async function findProduct(barcode) {


            const { data, error } = await db

                .from("products")

                .select("*")

                .eq(
                    "id",
                    barcode
                )

                .eq(
                    "business_id",
                    selectedBusiness.id
                )

                .single();



            if (error) {

                alert("Product not found");

                return;

            }



            document.getElementById(
                "scanResult"
            ).innerHTML =

                `

<h3>${data.name}</h3>

Price ₹${data.price}


<br>


<button onclick="addToCart(${data.id})">

Add Cart

</button>

`;



        }









        // CREATE CART


        async function createCart() {



            let { data, error } = await db

                .from("carts")

                .select("*")

                .eq(
                    "user_id",
                    user.id
                )

                .eq(
                    "business_id",
                    selectedBusiness.id
                )

                .eq(
                    "status",
                    "active"
                )

                .maybeSingle();



            if (data) {

                currentCart = data;

                return data;

            }




            let result = await db

                .from("carts")

                .insert({

                    user_id: user.id,

                    business_id: selectedBusiness.id,

                    status: "active"

                })

                .select()

                .single();



            if (result.error) {

                alert(result.error.message);

                return null;

            }



            currentCart = result.data;


            return currentCart;


        }









        // ADD CART


        async function addToCart(productId) {



            if (!user) {

                alert("Login first");

                return;

            }


            await createCart();



            const { data: product, error: pError } = await db

                .from("products")

                .select("price")

                .eq(
                    "id",
                    productId
                )

                .single();



            if (pError) {

                alert(pError.message);

                return;

            }





            const { error } = await db

                .from("cart_items")

                .insert({

                    cart_id: currentCart.id,

                    product_id: productId,

                    quantity: 1,

                    price: product.price

                });



            if (error) {

                alert(error.message);

                return;

            }



            alert("Added to cart");


        }









        // VIEW CART


        async function loadCart() {



            await createCart();



            const { data, error } = await db

                .from("cart_items")

                .select(`

quantity,

price,

products(name)

`)

                .eq(
                    "cart_id",
                    currentCart.id
                );



            if (error) {

                alert(error.message);

                return;

            }



            let html = "";


            let total = 0;



            data.forEach(item => {


                let amount =
                    item.price * item.quantity;


                total += amount;



                html += `

${item.products.name}

×

${item.quantity}

₹${amount}

<br>

`;



            });



            html += `

<hr>

Total ₹${total}

`;



            document.getElementById(
                "cartView"
            ).innerHTML = html;


        }




    </script>


</body>

</html>
